chip: HuaKun AT3500 G3 (昇腾 910B4)
chip_short: 3500 G3
aliases:
  - 3500 G3
  - AT3500 G3
  - HuaKun AT3500 G3 (64G)
  - 910B4
  - 910B
  - Atlas 800I A2
  - 华为 Atlas 800I A2
category: legacy
status: shipping
vendor: 华为 / 华鲲振宇
release: '2024'

summary: >-
  华鲲振宇面向大模型推理的旗舰国产异构服务器（华为内部代号 910B4 / 910B / Atlas 800I A2）。
  单机 8 卡 64GB HBM2e，鲲鹏 920 + 昇腾 910B4 全栈国产架构，
  单机 FP16 算力 2.24 PFLOPS，可承载 7B~72B 模型推理与轻量训练；
  双机两台 = 16 卡，可跑满血 671B（DeepSeek-R1 / V3 等）长上下文 Int8 推理。

memory:
  per_card_gb: 64
  type: HBM2e

compute:
  fp16_tflops: 280
  fp32_tflops: 75
  int8_tops: 560
  bf16_tflops: 280

interconnect:
  type: HCCS
  bandwidth_gbps: 392
  topology: HCCS FullMesh 8 卡全互联（双向 392 GB/s）

system:
  cpu: 鲲鹏 920 (ARM) ×4 @ 2.6 GHz
  cpu_cores: 192
  ram_gb: 1024
  ram_type: DDR4
  ram_speed: 3200 MT/s
  ram_slots: 32
  ram_per_dimm: 16/32/64 GB
  nic: 8×200GE QSFP (RoCEv2, NPU 直出)
  psu_w: 10400
  storage:
    system: 2×480GB SATA SSD (RAID 1)
    data: 2×3.84TB NVMe SSD (可扩)
  pcie: 3×PCIe 4.0 插槽
  cooling: 8×热插拔风扇模组, N+1 冗余, 风冷
  form_factor: 4U 机架式
  dimensions: 175mm × 447mm × 790mm (H × W × D)
  operating_temp: 5°C ~ 35°C
  hbm_bandwidth_gbps: 800

software:
  os: openEuler 22.03
  cann: 8.0.RC2
  mindie: 2.0.RC2
  frameworks:
    - vLLM-Ascend
    - MindIE
    - MindSpore

price_rmb_wan:
  low: 100
  high: 120
  note: 8 卡整机报价区间（含三年原厂维保）；双机 16 卡整柜 200-240 万

use_cases:
  - 满血 671B 长上下文 Int8 推理（双机 16 卡）
  - Qwen3-32B / 70B / 235B-A22B 主力推理（单机 8 卡）
  - DeepSeek-70B 推理（单机 4-8 卡）
  - DeepSeek-V4 Flash / V4-Pro 部署
  - LoRA 微调与轻量级训练
  - 政务/企业私有化部署（信创合规）

notes:
  - 「3500 G3 / AT3500 G3 / 910B4 / 910B / Atlas 800I A2」是同一台机器的多种叫法
  - 华为内部常用 910B4 作为芯片名/机器代号；华鲲振宇整机 SKU 为 AT3500 G3
  - 单卡 FP16 280 TFLOPS @910B4；单机 8 卡整机 2.24 PFLOPS @FP16 / 4.48 POPS @INT8
  - 显存 64GB HBM2e（也有 32GB 版本，按订单配置）；显存带宽 800 GB/s/卡
  - 整机 FP32 算力 0.60 PFLOPS（8 卡）
  - 能效比 0.6 PFLOPS/kW 超高

