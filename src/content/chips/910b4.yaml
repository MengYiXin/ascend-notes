chip: Atlas 800I A2 (昇腾 910B4)
chip_short: 910B4
aliases:
  - 910B4
  - 800I A2
  - 华为 Atlas 800I A2
  - 强 A800I A2
category: mainstream
status: shipping
vendor: 华为 / 华鲲振宇
release: '2024'

summary: >-
  8 卡主力推理服务器，单卡 64GB HBM2e + HCCS 392GB/s 全互联，
  覆盖 Qwen3 全系、DeepSeek-70B、V4 Flash/Pro 等中小模型。

memory:
  per_card_gb: 64
  type: HBM2e

compute:
  fp16_tflops: 376
  int8_tops: 752
  bf16_tflops: 376

interconnect:
  type: HCCS
  bandwidth_gbps: 392
  topology: 8 卡全互联

system:
  cpu: 鲲鹏 920 (ARM) ×4
  cpu_cores: 192
  ram_gb: 512
  nic: 8×200GE QSFP (RoCEv2)
  psu_w: 3200

software:
  os: openEuler 22.03
  cann: 8.0.RC2
  mindie: 2.0.RC2
  frameworks:
    - vLLM-Ascend
    - MindIE
    - MindSpore

price_rmb_wan:
  low: 95
  high: 117.6
  note: 8 卡整机，华为直采 95-110 万；华鲲振宇 AT800 A2 同配 ~117.6 万

use_cases:
  - Qwen3-32B / 70B / 235B-A22B 主力推理
  - DeepSeek-70B 推理
  - DeepSeek-V4-Flash / V4-Pro 中等规模部署
  - 4+4 混合部署（VL-32B + Qwen3.6-278 等组合场景）
  - 政务/企业私有化知识库

notes:
  - '800I A2 = 910B4 是华为内部常用的等价说法，本档案统一以 910B4 为代号'
  - 单卡可装 Qwen3-32B (2 卡) / DeepSeek-70B (4 卡)；完整 8 卡可推 Qwen3-235B-A22B FP16

