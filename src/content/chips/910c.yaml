chip: Atlas 800I A3 560T (昇腾 910C)
chip_short: 910C
aliases:
  - 910C
  - 800I A3
  - 800I A3 560T
  - HuaKun AT958 B3
category: flagship
status: shipping
vendor: 华为 / 华鲲振宇
release: '2025'

summary: >-
  新一代 8 卡旗舰推理服务器，单卡 128GB HBM + 互联带宽 780GB/s，
  FP16 算力 ≥560 TFLOPS/卡。是 V4 Flash / V4 Pro / GLM5 等
  主流模型的推荐部署平台。

memory:
  per_card_gb: 128
  type: HBM3

compute:
  fp16_tflops: 560
  int8_tops: 1120
  bf16_tflops: 560

interconnect:
  type: HCCS / RoCE
  bandwidth_gbps: 780
  topology: 8 卡全互联 + 8×400GE RoCE

system:
  cpu: 鲲鹏 920 (ARM) ×4
  cpu_cores: 320
  ram_gb: 1024
  nic: 8×400GE + 2×100GE + 2×10/25GE
  psu_w: 3600

software:
  os: openEuler 22.03
  cann: 8.0.RC2
  mindie: 2.0.RC2
  frameworks:
    - vLLM-Ascend (deepseekv4-a3)
    - MindIE
    - MindSpore

price_rmb_wan:
  low: null
  high: null
  note: 公开报价未披露，建议询价华鲲振宇/华为政企

use_cases:
  - DeepSeek-V4-Flash / V4-Pro 主力部署（单机 / 双机）
  - GLM5 单机部署
  - 满血 DS-V3 / R1 推理（多机大 EP）
  - 1M 超长上下文、Prefix Cache、Function Call 全功能

notes:
  - 910C 是 910B 的下一代，对外带宽与算力均显著提升
  - vLLM-Ascend 提供 deepseekv4-a3 镜像，支持 PD 分离、A2/A3 跨代混部
  - 单机 8 卡版本（HuaKun AT958 B3）：560T@INT8 / 4.4 PFLOPS@FP16
  - 单节点 626T 版本：626 TFLOPS FP16 / 10.8 POPS INT8

